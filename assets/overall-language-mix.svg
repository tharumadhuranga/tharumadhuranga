<svg width="100%" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Overall language mix</title>
  <desc id="desc">Combined language percentages from Tharusha's local backend and frontend projects.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #f7fbff; } .panel { fill: #e8f4ff; stroke: #b8d8ee; } .ink { fill: #123047; } .muted { fill: #527086; } .track { fill: #d8eaf3; } .bar { fill: #087ea4; }
    @media (prefers-color-scheme: dark) { .background { fill: #07151f; } .panel { fill: #0c2230; stroke: #19475d; } .ink { fill: #e7f7ff; } .muted { fill: #9ac0d0; } .track { fill: #19475d; } .bar { fill: #62d8ff; } }
    .bars { animation: float 4s ease-in-out infinite; } .scan { animation: scan 5s linear infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes scan { 0% { transform: translateX(-250px); opacity: 0; } 20%, 75% { opacity: .65; } 100% { transform: translateX(1250px); opacity: 0; } }
  </style>
  <defs><linearGradient id="wash" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#11A7D8" stop-opacity=".16"/><stop offset="1" stop-color="#7EE7C8" stop-opacity=".08"/></linearGradient><clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath></defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" class="background"/><rect width="1200" height="360" fill="url(#wash)"/><rect class="panel" x="28" y="24" width="1144" height="312" rx="20" stroke-width="2"/>
    <text x="68" y="65" class="ink" font-family="Verdana, sans-serif" font-size="22" font-weight="700">OVERALL LANGUAGE MIX</text><text x="68" y="88" class="muted" font-family="Verdana, sans-serif" font-size="12">COMBINED FROM MY LOCAL BACKEND AND FRONTEND PROJECTS</text>
    <g class="bars" font-family="Verdana, sans-serif">
      <image href="data:image/svg+xml;base64," x="70" y="112" width="30" height="30"/><text x="114" y="133" class="ink" font-size="15" font-weight="700">JavaScript</text><text x="535" y="133" class="accent" font-size="15" font-weight="700" text-anchor="end">20.0%</text><rect class="track" x="114" y="144" width="421" height="8" rx="4"/><rect class="bar" x="114" y="144" width="84" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="610" y="112" width="30" height="30"/><text x="654" y="133" class="ink" font-size="15" font-weight="700">JSX / React</text><text x="1075" y="133" class="accent" font-size="15" font-weight="700" text-anchor="end">21.5%</text><rect class="track" x="654" y="144" width="421" height="8" rx="4"/><rect class="bar" x="654" y="144" width="91" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="70" y="180" width="30" height="30"/><text x="114" y="201" class="ink" font-size="15" font-weight="700">JSON</text><text x="535" y="201" class="accent" font-size="15" font-weight="700" text-anchor="end">34.2%</text><rect class="track" x="114" y="212" width="421" height="8" rx="4"/><rect class="bar" x="114" y="212" width="144" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="610" y="180" width="30" height="30"/><text x="654" y="201" class="ink" font-size="15" font-weight="700">HTML</text><text x="1075" y="201" class="accent" font-size="15" font-weight="700" text-anchor="end">19.1%</text><rect class="track" x="654" y="212" width="421" height="8" rx="4"/><rect class="bar" x="654" y="212" width="80" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="70" y="248" width="30" height="30"/><text x="114" y="269" class="ink" font-size="15" font-weight="700">CSS</text><text x="535" y="269" class="accent" font-size="15" font-weight="700" text-anchor="end">1.1%</text><rect class="track" x="114" y="280" width="421" height="8" rx="4"/><rect class="bar" x="114" y="280" width="5" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="610" y="248" width="30" height="30"/><text x="654" y="269" class="ink" font-size="15" font-weight="700">EJS</text><text x="1075" y="269" class="accent" font-size="15" font-weight="700" text-anchor="end">3.4%</text><rect class="track" x="654" y="280" width="421" height="8" rx="4"/><rect class="bar" x="654" y="280" width="14" height="8" rx="4"/>
      <image href="data:image/svg+xml;base64," x="610" y="312" width="18" height="18"/><text x="68" y="320" class="muted" font-size="11">YAML 0.8%  •  C 2.0%  •  Percentages calculated from local source-file sizes</text>
    </g>
    <g class="scan"><rect x="0" y="102" width="190" height="2" fill="#62d8ff"/></g>
  </g>
</svg>
